<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LongDrive — Music Player</title>
  <meta name="description" content="A personal dark-theme music player for curated tracks and devotional music — powered by GitHub Pages." />
  <meta name="theme-color" content="#0a0a0f" />

  <!-- Open Graph -->
  <meta property="og:title"       content="LongDrive Music Player" />
  <meta property="og:description" content="Personal music player — My Music &amp; Devotional playlists." />
  <meta property="og:type"        content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon (inline SVG data-URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c3aed'/><path d='M10 22V11l14-3v11' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/><circle cx='8' cy='22' r='3' fill='white'/><circle cx='22' cy='20' r='3' fill='white'/></svg>" />
</head>
<body>

<!-- Hidden audio element — streams on demand -->
<audio id="audio" preload="none"></audio>

<div id="app">

  <!-- ════════════════════════════════════════════
       SIDEBAR
       ════════════════════════════════════════════ -->
  <aside id="sidebar" role="complementary" aria-label="Playlist navigation">

    <!-- Logo -->
    <div class="sidebar-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="8" fill="#7c3aed"/>
        <path d="M10 22V11l14-3v11" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="8" cy="22" r="3" fill="white"/>
        <circle cx="22" cy="20" r="3" fill="white"/>
      </svg>
      <span class="sidebar-logo-text">Long<span>Drive</span></span>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search-input" type="search" placeholder="Search tracks…" autocomplete="off" aria-label="Search tracks" />
    </div>

    <!-- Playlist switcher -->
    <div>
      <p class="sidebar-nav-label">Playlists</p>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Playlists"></nav>
    </div>

    <!-- Track mini-list -->
    <div id="sidebar-tracklist" class="sidebar-tracklist" role="list" aria-label="Track list"></div>

  </aside>

  <!-- ════════════════════════════════════════════
       MAIN CONTENT
       ════════════════════════════════════════════ -->
  <main id="main" role="main">

    <!-- Now Playing card -->
    <section id="now-playing" aria-label="Now playing">

      <!-- Album art / gradient placeholder -->
      <div id="track-art" aria-hidden="true">
        <span class="art-icon">🎵</span>
      </div>

      <!-- Track meta + EQ -->
      <div id="np-meta">
        <p id="np-playlist"></p>
        <h1 id="np-title" class="empty">Select a track to play</h1>
        <p id="np-subtitle"></p>

        <!-- Equalizer bars -->
        <div id="equalizer" class="paused" aria-hidden="true">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
      </div>

    </section>

    <!-- Track list panel -->
    <section id="tracklist-panel" aria-label="Track list">
      <div class="tracklist-header">
        <span class="tracklist-title" id="tracklist-title">All Tracks</span>
        <span class="track-count" id="track-count">0 tracks</span>
      </div>
      <div class="tracklist" id="main-tracklist" role="list"></div>
    </section>

  </main>

  <!-- ════════════════════════════════════════════
       BOTTOM PLAYBACK BAR
       ════════════════════════════════════════════ -->
  <footer id="bar" role="contentinfo" aria-label="Playback controls">

    <!-- Controls -->
    <div class="bar-controls" aria-label="Transport">

      <!-- Shuffle -->
      <button id="btn-shuffle" title="Shuffle" aria-label="Toggle shuffle" aria-pressed="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
          <line x1="4" y1="4" x2="9" y2="9"/>
        </svg>
      </button>

      <!-- Previous -->
      <button id="btn-prev" title="Previous (P)" aria-label="Previous track">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Play / Pause -->
      <button id="btn-play-pause" title="Play / Pause (Space)" aria-label="Play or pause">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>

      <!-- Next -->
      <button id="btn-next" title="Next (N)" aria-label="Next track">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Repeat -->
      <button id="btn-repeat" title="Repeat Off" aria-label="Toggle repeat" aria-pressed="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>

    </div>

    <!-- Progress -->
    <div class="bar-progress-wrap">
      <input id="seek-bar" type="range" class="seek-bar" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
      <div class="time-display">
        <span id="time-elapsed">0:00</span>
        <span id="time-remaining">-0:00</span>
      </div>
    </div>

    <!-- Volume -->
    <div class="bar-volume">
      <button id="btn-volume" title="Mute" aria-label="Toggle mute">
        <!-- filled by JS -->
      </button>
      <input id="volume-bar" type="range" class="volume-bar" min="0" max="100" value="80" step="1" aria-label="Volume" />
    </div>

  </footer>

</div><!-- /#app -->

<script src="player.js"></script>
</body>
</html>
